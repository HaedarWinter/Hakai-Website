# ============================================
# NGINX Configuration - Optimized for Lighthouse
# ============================================
# 
# Installation:
# 1. Copy this file to: /etc/nginx/sites-available/yourdomain.conf
# 2. Create symlink: sudo ln -s /etc/nginx/sites-available/yourdomain.conf /etc/nginx/sites-enabled/
# 3. Test config: sudo nginx -t
# 4. Reload: sudo systemctl reload nginx
#
# Replace:
# - yourdomain.com → your actual domain
# - /path/to/your/public → actual path to Laravel public directory
# - php8.2-fpm.sock → your PHP-FPM version
# ============================================

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    
    server_name yourdomain.com www.yourdomain.com;
    
    # Redirect all HTTP requests to HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS with HTTP/2
server {
    # Enable HTTP/2
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    
    server_name yourdomain.com www.yourdomain.com;
    root /path/to/your/public;
    
    index index.php index.html index.htm;
    
    charset utf-8;
    
    # ============================================
    # SSL/TLS Configuration
    # ============================================
    
    # Let's Encrypt SSL certificates
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    
    # SSL session cache (improve performance)
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Modern SSL configuration (A+ rating)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    
    # OCSP Stapling (faster SSL handshake)
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/yourdomain.com/chain.pem;
    
    # ============================================
    # Security Headers (Best Practices Score +10)
    # ============================================
    
    # HSTS - Force HTTPS for 1 year
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    
    # Prevent clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;
    
    # Prevent MIME sniffing
    add_header X-Content-Type-Options "nosniff" always;
    
    # XSS Protection
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Referrer Policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Content Security Policy (adjust based on your needs)
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self';" always;
    
    # ============================================
    # GZIP Compression (Performance Score +10)
    # ============================================
    
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-javascript
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        font/otf
        font/ttf
        image/svg+xml
        image/x-icon
        text/css
        text/javascript
        text/plain
        text/xml;
    
    # ============================================
    # Browser Caching (Performance Score +12)
    # ============================================
    
    # Static assets - Cache for 1 year
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|otf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }
    
    # HTML - Cache for 1 hour
    location ~* \.(html|htm)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }
    
    # ============================================
    # Laravel Application
    # ============================================
    
    # Laravel front controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Uploaded files must never be executed, even if a bad extension slips through.
    location ~* ^/storage/.*\.(php|phtml|phar)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # PHP-FPM Configuration
    location ~ \.php$ {
        # Security: Don't allow direct access to PHP files
        try_files $uri =404;
        
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;  # Adjust PHP version
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        
        # Increase timeout for long-running scripts
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }
    
    # ============================================
    # Security: Deny Access to Sensitive Files
    # ============================================
    
    # Deny access to hidden files (except .well-known for Let's Encrypt)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Deny access to sensitive Laravel files
    location ~* (\.env|\.git|composer\.json|composer\.lock|package\.json|package-lock\.json|\.sql|\.sqlite)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Deny access to vendor directory
    location ~ /vendor/ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # ============================================
    # Logging
    # ============================================
    
    access_log /var/log/nginx/yourdomain-access.log;
    error_log /var/log/nginx/yourdomain-error.log error;
    
    # ============================================
    # File Upload Limits
    # ============================================
    
    client_max_body_size 100M;
    client_body_timeout 120s;
}

# ============================================
# PHP-FPM Optimization (Optional)
# ============================================
# 
# Edit: /etc/php/8.2/fpm/pool.d/www.conf
# 
# pm = dynamic
# pm.max_children = 50
# pm.start_servers = 5
# pm.min_spare_servers = 5
# pm.max_spare_servers = 35
# pm.max_requests = 500
#
# Then restart: sudo systemctl restart php8.2-fpm
# ============================================

